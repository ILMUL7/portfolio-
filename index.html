<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="protfolio.css">

</head>
<body>

<nav>
  <div class="container">
    <a href="#home" class="logo" id="navLogo"></a>
    <div class="links" id="navLinks">
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#contact">Contact</a>
      <button class="theme-btn" id="themeBtn" title="Toggle theme">🌙</button>
    </div>
    <button class="menu-btn" id="menuBtn">☰</button>
  </div>
</nav>

<header class="hero" id="home">
  <div class="container">
    <div>
      <span class="badge reveal"><i></i><span id="availability"></span></span>
      <h1 class="reveal">Hi, I'm  <span class="grad" id="heroName"></span></h1>
      <p class="sub reveal" id="heroTitle"></p>
      <div class="btns reveal">
        <a class="btn primary" id="cvBtn" download>⬇ Download CV</a>
        <a class="btn ghost" href="#projects">View Projects</a>
      </div>
      <div class="socials reveal" id="socials"></div>
    </div>
    <div class="photo-wrap reveal">
      <img class="photo" id="photo" alt="Profile picture">
      <div class="photo-fallback" id="photoFallback"></div>
    </div>
  </div>
  <style>
    .photo{
  position:relative;
  width:320px;
  height:320px;
  border-radius:50%;      /* makes it a circle */
  object-fit:cover;       /* fills the circle without stretching */
  object-position:50% 20%;/* centers the face; see below to adjust */
  border:5px solid var(--card);
  background:var(--card2);
  display:block;
}
  </style>
</header>

<section id="about">
  <div class="container reveal">
    <div class="eyebrow">About me</div>
    <h2>A little about who I am</h2>
    <div class="about-grid">
      <div id="aboutText"></div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</section>

<section id="skills" style="background:var(--card2)">
  <div class="container reveal">
    <div class="eyebrow">Skills</div>
    <h2>Tools &amp; technologies</h2>
    <div class="skills" id="skillsList"></div>
  </div>
</section>

<section id="projects">
  <div class="container">
    <div class="reveal">
      <div class="eyebrow">Portfolio</div>
      <h2>Featured projects</h2>
    </div>
    <div class="projects" id="projectsList"></div>
  </div>
</section>

<section id="experience" style="background:var(--card2)">
  <div class="container reveal">
    <div class="two-col">
      <div>
        <div class="eyebrow">Experience</div>
        <h2>Work history</h2>
        <div class="timeline" id="expList"></div>
      </div>
      <div>
        <div class="eyebrow">Education</div>
        <h2>Academic background</h2>
        <div class="timeline" id="eduList"></div>
      </div>
    </div>
  </div>
</section>

<section id="contact">
  <div class="container reveal">
    <div class="contact-box">
      <div class="eyebrow">Contact</div>
      <h2 style="margin-bottom:14px">Let's work together</h2>
      <p id="contactText"></p>
      <a class="btn primary" id="emailBtn">✉ Send me an email</a>
      <div class="contact-info" id="contactInfo"></div>
    </div>
  </div>
</section>

<footer><div class="container" id="footerText"></div></footer>
<script src="protfolio.js"></script>

</body>
</html>
